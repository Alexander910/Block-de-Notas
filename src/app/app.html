<div class="layout">

  <app-navbar (searchChange)="onSearch($event)" (newNote)="onNewNote()" (sidebarToggle)="toggleSidebar()"></app-navbar>

  <div class="main-body">

    <app-sidebar [searchText]="searchText" (newNote)="onNewNote()" (openPapelera)="abrirPapelera()" [class.collapsed]="!isSidebarOpen"></app-sidebar>

    <div class="main-content">
      @if (mostrarPapelera) {
        <app-papelera (cerrar)="cerrarPapelera()"></app-papelera>
      } @else {
        <app-editor></app-editor>
      }
    </div>

  </div>

</div>
