<nav class="navbar">
  <!-- Left Side -->
  <div class="nav-left">
    <div class="menu-btn" (click)="toggleSidebar()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </div>
    <div class="logo-container">
      <div class="logo-icon">
        <img src="notas.png" alt="Notas Logo" width="30" height="30" />
      </div>
      <span class="logo-text">Online<br>Notepad</span>
    </div>
    
    <div class="title-input-container">
      <input type="text" class="title-input" [(ngModel)]="titulo"/>
    </div>
  </div>

  <!-- Right Side -->
  <div class="nav-right">
    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" placeholder="Search..." [(ngModel)]="searchText" (input)="onSearchChange()" />
      <span class="shortcut-hint">Ctrl K</span>
    </div>
    
    <div class="icon-btn" (click)="toggleDarkMode()">
      <svg xmlns="http://www.w3.org/2000/svg"
       width="20"
       height="20"
       viewBox="0 0 24 24"
       fill="currentColor"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    </div>
    
    <div class="user-avatar">
      AP
    </div>
  </div>
</nav>
