<div class="editor-container" [style.--editor-font-size]="fontSize">

  <div class="editor-header">

    <input
      type="text"
      class="titulo-input"
      placeholder="Título de la nota"
      [(ngModel)]="titulo">

    <button class="btn-guardar" (click)="guardarNota()">
      Guardar
    </button>
    <button class="btn-eliminar" (click)="eliminarNota()" *ngIf="notaActualId">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      Eliminar
    </button>
  </div>

  <div class="toolbar-row">
    <select class="font-size-select" (change)="cambiarFuente($event)">
      <option value="12px">12px</option>
      <option value="14px">14px</option>
      <option value="16px" selected>16px</option>
      <option value="18px">18px</option>
      <option value="24px">24px</option>
    </select>
    <app-editor-toolbar [editor]="editor"></app-editor-toolbar>
    <ngx-editor-menu [editor]="editor" [toolbar]="toolbar"></ngx-editor-menu>
  </div>

  <ngx-editor
    [editor]="editor"
    [(ngModel)]="html"
    placeholder="Empieza a escribir..."
  ></ngx-editor>

 <div class="meta-info" *ngIf="notaActualId">
  <span> Creada: {{ fechaCreacion | date:'short' }}</span>
  <span> Editada: {{ fechaEdicion | date:'short' }}</span>
</div>



</div>
